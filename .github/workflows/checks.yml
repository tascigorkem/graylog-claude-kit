# Runs the "Checks before committing" from CLAUDE.md on every push and pull request:
# the oldest supported Python (3.9) and the newest stable one on Linux, plus the newest on macOS.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # allows a manual run from the Actions tab

permissions:
  contents: read

jobs:
  repository:
    name: Repository consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ruff reads its settings from ruff.toml. The version is pinned so a new Ruff release
      # cannot turn the build red on its own; raise it deliberately.
      - name: Ruff lint
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.4"
          args: "check --output-format=github"

      - name: Ruff format
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.4"
          args: "format --check --diff"

      - name: Shell wrapper is valid POSIX sh
        run: |
          sh -n plugins/graylog-search/bin/graylog-search
          shellcheck --shell=sh plugins/graylog-search/bin/graylog-search

      - name: Plugin and marketplace manifests are valid JSON
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool plugins/graylog-search/.claude-plugin/plugin.json > /dev/null

      - name: CLI version matches plugin.json
        run: |
          cli="$(plugins/graylog-search/bin/graylog-search --version | cut -d' ' -f2)"
          manifest="$(python3 -c 'import json; print(json.load(open("plugins/graylog-search/.claude-plugin/plugin.json"))["version"])')"
          echo "CLI: $cli  plugin.json: $manifest"
          test "$cli" = "$manifest"

      - name: LICENSE and NOTICE copies are identical
        run: |
          cmp LICENSE plugins/graylog-search/LICENSE
          cmp NOTICE plugins/graylog-search/NOTICE

  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    needs: repository       # start only after the repository checks pass; skipped if they fail
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false      # report every combination, even if one fails
      matrix:
        include:
          # Python 3.9 is end of life, but it is the built-in python3 on macOS, so this project
          # still supports it. GitHub has no 3.9 builds for Ubuntu 26.04 (ubuntu-latest), so
          # this run is pinned to the last Ubuntu that has them.
          - { os: ubuntu-24.04,  python: "3.9" }    # oldest supported by this project
          - { os: ubuntu-latest, python: "3.15" }   # newest stable Python
          - { os: macos-latest,  python: "3.15" }   # macOS: BSD tools, different /bin/sh
    env:
      SCRIPT: plugins/graylog-search/skills/graylog/scripts/graylog_search.py
      CLI: plugins/graylog-search/bin/graylog-search
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Compile
        run: python3 -m py_compile "$SCRIPT"

      - name: No syntax newer than Python 3.9
        run: python3 -c "import ast, os; ast.parse(open(os.environ['SCRIPT']).read(), feature_version=(3, 9))"

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: CLI starts and prints help
        run: |
          "$CLI" --help > /dev/null
          "$CLI" --version

      - name: CLI works through a symlink
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$PWD/$CLI" "$RUNNER_TEMP/bin/graylog-search"
          "$RUNNER_TEMP/bin/graylog-search" --version

      - name: Clear errors without configuration
        run: |
          # No host configured: must fail with exit code 1 and say how to fix it.
          set +e
          out="$(env -u GRAYLOG_HOST "$CLI" --since 1h 'x' 2>&1)"; code=$?
          set -e
          echo "$out"
          test "$code" -eq 1
          echo "$out" | grep -q "GRAYLOG_HOST"
